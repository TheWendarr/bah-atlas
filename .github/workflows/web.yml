# C23: test the site on every change, and deploy it from main (D24).
# Third-party actions are pinned to a commit, and the deploy step alone sees the token.
name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "delivery/**"
      - "pipeline/handoff/contract.py"
      - "tools/check_host.py"
      - "tools/grid_golden.py"
      - "Makefile"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "delivery/**"
      - "pipeline/handoff/contract.py"
      - "tools/check_host.py"
      - "tools/grid_golden.py"
      - "Makefile"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: make web-deps
      - run: make web-test
      - run: python3 -m unittest tests.test_check_host
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make web-e2e
      - run: make web-build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-deps
      - run: make web-build
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: npx wrangler pages deploy dist --project-name bah-atlas --branch main
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: make site-check
      # The two live checks report separately: one failing still runs the other.
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        working-directory: web
      - run: make web-e2e-live
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
